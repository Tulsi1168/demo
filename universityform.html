<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>University Course Registration</title>
</head>

<body>

    <h1>University Course Registration Form</h1>

    <form>

       
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        
        <label for="studentid">Student ID:</label>
        <input type="text" id="studentid" name="studentid" required>
        <br><br>

        
        <label for="email">University Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
        <br><br>

       
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        
        <label for="semester">Semester:</label>
        <select id="semester" name="semester" required>
            <option value="">-- Select Semester --</option>
            <option value="1">1st Semester</option>
            <option value="2">2nd Semester</option>
            <option value="3">3rd Semester</option>
            <option value="4">4th Semester</option>
        </select>
        <br><br>

        
        <label for="course">Select Course:</label>
        <select id="course" name="course" required>
            <option value="">-- Select Course --</option>
            <option value="cse">Computer Science</option>
            <option value="eee">Electrical Engineering</option>
            <option value="bba">Business Administration</option>
            <option value="english">English</option>
        </select>
        <br><br>

        
        <p>Course Type:</p>

        <input type="radio" id="regular" name="type" value="regular" required>
        <label for="regular">Regular</label>

        <input type="radio" id="online" name="type" value="online">
        <label for="online">Online</label>

        <br><br>

        
        <p>Additional Courses:</p>

        <input type="checkbox" id="math" name="additional" value="math">
        <label for="math">Mathematics</label>

        <input type="checkbox" id="programming" name="additional" value="programming">
        <label for="programming">Programming</label>

        <input type="checkbox" id="database" name="additional" value="database">
        <label for="database">Database</label>

        <br><br>

        
        <label for="number">Number of Courses:</label>
        <input type="number" id="number" name="number"
               min="1" max="6" required>
        <br><br>

        
        <label for="comments">Comments:</label>
        <br>
        <textarea id="comments" name="comments"
                  rows="4" cols="40"
                  placeholder="Write any special request..."></textarea>

        <br><br>

        
        <input type="submit" value="Register">

       
        <input type="reset" value="Clear">

    </form>

</body>

</html>
