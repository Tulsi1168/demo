<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Profile Cards</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 30px;
        }

        h1{
            text-align: center;
            text-decoration:underline;
        }

        
        .card-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        
        .card {
            position: relative;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

       
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: green;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
        }

        
        .card-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        .card h2 {
            margin: 5px 0;
        }

        .card p {
            color: #666;
            margin: 5px 0 15px;
        }

        .button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            cursor: pointer;
        }

        
        @media (max-width: 768px) {

            .card-container {
                grid-template-columns: 1fr;
            }

        }
    </style>
</head>

<body>

    <h1>Our Team</h1>

    <div class="card-container">

        
        <div class="card">

            <span class="badge">ONLINE</span>

            <div class="card-content">
                <img src="https://via.placeholder.com/100"
                     alt="Profile picture"
                     class="profile-img">

                <h2>Tulsi</h2>
                <p>Web Developer</p>

                <button class="button">View Profile</button>
            </div>

        </div>

        
        <div class="card">

            <span class="badge">NEW</span>

            <div class="card-content">
                <img src="https://via.placeholder.com/100"
                     alt="Profile picture"
                     class="profile-img">

                <h2>Lucky</h2>
                <p>UI Designer</p>

                <button class="button">View Profile</button>
            </div>

        </div>

        
        <div class="card">

            <span class="badge">ONLINE</span>

            <div class="card-content">
                <img src="https://via.placeholder.com/100"
                     alt="Profile picture"
                     class="profile-img">

                <h2>Amrito</h2>
                <p>Software Engineer</p>

                <button class="button">View Profile</button>
            </div>

        </div>

    </div>

</body>
</html>
